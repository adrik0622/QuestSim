# Manual only (director 2026-10-26: testing is local-first via scripts/test_all.sh).
# Run from the GitHub Actions tab when a hosted Linux/Windows check is wanted; nothing runs on push.
name: checks
on:
  workflow_dispatch:

jobs:
  domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Domain checks
        shell: bash
        run: bash scripts/check.sh

  population-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install glslc (kernels must still compile)
        run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Population checks (CPU reference only)
        run: bash scripts/run_population.sh check --backend cpu

  game-compile:
    # Compiles the Godot C# game (server + client code) from nuget.org packages; does not run Godot.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Use nuget.org instead of the local Godot package folder
        shell: bash
        run: cp experiments/population/NuGet.Config src/QuestSim.Game/NuGet.Config
      - name: Build game
        run: dotnet build src/QuestSim.Game -warnaserror

  game-suites:
    # Real headless server/client ENet suites with the pinned Godot.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Godot (checksum verified)
        run: bash scripts/install_godot.sh
      - name: Build game
        run: bash scripts/build_game.sh
      - name: ENet suites
        run: |
          set -e
          for suite in verify_items verify_build verify_multiplayer verify_save_failures verify_defeat verify_content; do
            echo "::group::$suite"; python3 scripts/$suite.py; echo "::endgroup::"
          done
